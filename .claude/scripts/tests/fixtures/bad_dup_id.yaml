carried_flags:
- T2 (rule of three) noted at Phase-B entry for GuardFactProvider vs. two prior ad-hoc fact shapes in
  S1 — user confirmed consolidation is in-scope for this ADR, not deferred.
decisions:
- '2.1 owns build_stub_guard_fact_provider() up front (not task 2.2/2.3''s cleanup) per fixture-doctrine.md
  #11 — GuardFactProvider is expected to grow a field per later task in this slice.'
- 2.2 is typed 'composition' rather than 'task' because it is the door wiring already-built collaborators
  (2.1's contract, the guard registry) — no new leaf logic of its own.
