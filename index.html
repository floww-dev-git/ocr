<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Document Intelligence</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --font-ui: 'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --font-id: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --bg: #F4F5F8; --surface: #FFFFFF; --surface-2: #F8F9FB; --surface-3: #EEF0F4;
  --line: #E3E6EC; --line-strong: #CBD0DA;
  --ink: #171C2E; --ink-2: #4C5468; --ink-3: #7B8296;
  --ai-a: #5B5BD6; --ai-b: #2AA8C4; --ai-c: #7C6CF0; --ai-grad: linear-gradient(135deg, #5B5BD6, #2AA8C4);
  --ai-soft: #EDEDFB; --ai-text: #4A48C4;
  --glow-a: rgba(91,91,214,.16); --glow-b: rgba(42,168,196,.12); --glass: rgba(255,255,255,.85);
  --pass: #1B9E5A; --pass-soft: #E4F5EC; --warn: #B87400; --warn-soft: #FFF3DC;
  --fail: #D9433B; --fail-soft: #FDE8E6; --info: #3B6FD9; --info-soft: #E6EEFC;
  --pending: #7A8299; --pending-soft: #EEF0F4;
  --user-bubble: #E9ECF3; --scrim: rgba(20,26,43,.35);
  --r-s: 6px; --r-m: 10px; --r-l: 14px;
  --shadow-float: 0 8px 24px rgba(20,26,43,.10);
  --rail-w: 260px; --sidebar-w: 320px; --content-w: 860px;
  --fs-xs: 12px; --fs-s: 13px; --fs-m: 14px; --fs-l: 16px; --fs-xl: 20px;
  --dur: 220ms; --ease: cubic-bezier(.2,.7,.2,1);
  color-scheme: light;
}
:root[data-theme="dark"] {
  --bg: #0F1117; --surface: #171A22; --surface-2: #1C2029; --surface-3: #242935;
  --line: #2A2F3A; --line-strong: #3A4050;
  --ink: #E7E9EE; --ink-2: #A8AEBD; --ink-3: #7E8597;
  --ai-a: #7D7DF0; --ai-b: #3DBBD6; --ai-c: #9A8CF5; --ai-grad: linear-gradient(135deg, #7D7DF0, #3DBBD6);
  --ai-soft: #24263A; --ai-text: #B3B3FF;
  --glow-a: rgba(125,125,240,.22); --glow-b: rgba(61,187,214,.16); --glass: rgba(23,26,34,.85);
  --pass: #3CC77A; --pass-soft: #12291C; --warn: #F0A93B; --warn-soft: #2E2410;
  --fail: #F0655D; --fail-soft: #331716; --info: #6C9BFF; --info-soft: #15203A;
  --pending: #8A93A8; --pending-soft: #232A3A;
  --user-bubble: #1F2637; --scrim: rgba(0,0,0,.5);
  --shadow-float: 0 8px 24px rgba(0,0,0,.45);
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { font: 400 var(--fs-m)/1.5 var(--font-ui); color: var(--ink); background: var(--bg); -webkit-font-smoothing: antialiased; }
h1, h2, h3, p, ul { margin: 0; }
ul { padding: 0; list-style: none; }
button { font: inherit; color: inherit; }
input, textarea, select { font: inherit; color: inherit; }
.id { font-family: var(--font-id); font-size: 0.93em; letter-spacing: .01em; }
:focus-visible { outline: 2px solid var(--ai-a); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
[hidden] { display: none !important; }

::selection { background: color-mix(in srgb, var(--ai-a) 30%, transparent); }
* { scrollbar-width: thin; scrollbar-color: var(--line-strong) transparent; }

/* ---------- AI orb (Direction C: ring, C3 palette) ---------- */
:root { --orb-c0: #c9d0ff; --orb-c1: #8C6CF0; --orb-c2: #5B5BD6; --orb-c3: #2AA8C4; --orb-c4: #9fe3f0; --orb-glow: .3; --orb-edge: .6; }
:root[data-theme="dark"] { --orb-c0: #e8fbff; --orb-c1: #B06CFF; --orb-c2: #4653E8; --orb-c3: #3FD8F5; --orb-c4: #dff5ff; --orb-glow: .38; --orb-edge: 1; }
.orb { position: relative; width: 1em; height: 1em; display: inline-block; flex: none; line-height: 0;
  --orb-sweep: conic-gradient(from 0deg, var(--orb-c0) 0deg, var(--orb-c1) 60deg, var(--orb-c1) 110deg, var(--orb-c4) 150deg, var(--orb-c2) 195deg, var(--orb-c3) 240deg, var(--orb-c3) 290deg, var(--orb-c4) 330deg, var(--orb-c0) 360deg);
  --orb-hole: radial-gradient(ellipse 36.5% 40.5% at 50% 50%, transparent 96%, #000 100%); }
.orb > i { position: absolute; inset: 0; border-radius: 50%; display: block; }
.orb > i > b { position: absolute; inset: 0; border-radius: 50%; display: block; -webkit-mask: var(--orb-hole); mask: var(--orb-hole); }
.orb .orb-glow { inset: -.12em; background: var(--orb-sweep); filter: blur(.035em); opacity: var(--orb-glow);
  -webkit-mask: radial-gradient(circle closest-side, transparent 64%, #000 74%, #000 80%, transparent 95%);
  mask: radial-gradient(circle closest-side, transparent 64%, #000 74%, #000 80%, transparent 95%); }
.orb .orb-band {
  -webkit-mask: radial-gradient(circle closest-side, #000 90%, rgba(0,0,0,.5) 95%, transparent 100%);
  mask: radial-gradient(circle closest-side, #000 90%, rgba(0,0,0,.5) 95%, transparent 100%); }
.orb .orb-band b { background: var(--orb-sweep); }
.orb .orb-hot { opacity: var(--orb-edge); filter: blur(.01em);
  -webkit-mask: radial-gradient(circle closest-side, #000 80%, transparent 86%);
  mask: radial-gradient(circle closest-side, #000 80%, transparent 86%); }
.orb .orb-hot b { background: conic-gradient(from 0deg, rgba(255,255,255,0) 0deg, rgba(255,255,255,.1) 90deg, #fff 135deg, rgba(255,255,255,.15) 185deg, rgba(255,255,255,0) 240deg, #fff 305deg, rgba(255,255,255,.4) 330deg, rgba(255,255,255,0) 360deg); }
.orb.working .orb-glow, .orb.working .orb-band, .orb.working .orb-hot { animation: orbspin 6s linear infinite; }
.orb.drift .orb-glow, .orb.drift .orb-band, .orb.drift .orb-hot { animation: orbspin 40s linear infinite; }
@keyframes orbspin { to { transform: rotate(360deg); } }
/* app.css — layout, rail, topbar, conversation, messages, activity, cards, sidebar, composer, dialogs */

/* ---------- layout ---------- */
.app { display: grid; grid-template-columns: var(--rail-w) 1fr var(--sidebar-w); grid-template-rows: 100vh; height: 100vh; overflow: hidden; }
.app.rail-collapsed { grid-template-columns: 56px 1fr var(--sidebar-w); }
.main { display: flex; flex-direction: column; min-width: 0; min-height: 0; height: 100vh; position: relative; overflow: hidden; }

/* ---------- buttons ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 34px; padding: 0 14px; border-radius: var(--r-m); border: 1px solid transparent; background: transparent; cursor: pointer; font-weight: 500; white-space: nowrap; transition: background var(--dur), border-color var(--dur), color var(--dur); }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn-primary { background: var(--ink); color: var(--bg); }
.btn-primary:hover:not(:disabled) { filter: brightness(1.15); }
.btn-ghost { border-color: var(--line-strong); background: var(--surface); }
.btn-ghost:hover { border-color: var(--ink-3); }
.btn-text { height: 28px; padding: 0 8px; color: var(--ai-text); font-size: var(--fs-s); }
.btn-text:hover { background: var(--ai-soft); }
.btn-text.danger { color: var(--fail); }
.btn-text.danger:hover { background: var(--fail-soft); }
.icon-btn { width: 32px; height: 32px; display: inline-flex; align-items: center; justify-content: center; border: 0; border-radius: var(--r-s); background: transparent; color: var(--ink-2); cursor: pointer; flex: none; }
.icon-btn:hover { background: var(--surface-3); color: var(--ink); }
.icon-btn svg, .btn svg { width: 16px; height: 16px; }
svg.ico { width: 16px; height: 16px; flex: none; }

/* ---------- rail ---------- */
.rail { background: var(--surface); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; height: 100vh; padding: 12px 10px; gap: 10px; }
.rail-brand { display: flex; align-items: center; gap: 10px; padding: 4px 4px 8px; }
.brand-mark { width: 22px; height: 22px; border-radius: 6px 6px 6px 2px; background: var(--ai-grad); flex: none; }
.brand-text { display: flex; flex-direction: column; line-height: 1.15; min-width: 0; }
.brand-name { font-weight: 600; font-size: var(--fs-m); white-space: nowrap; }
.brand-sub { font-size: var(--fs-xs); color: var(--ink-3); }
.rail-collapse { margin-left: auto; }
.rail-new { width: 100%; }
.rail-search { display: flex; align-items: center; gap: 8px; height: 34px; padding: 0 10px; border: 1px solid var(--line); border-radius: var(--r-m); background: var(--surface-2); color: var(--ink-3); }
.rail-search input { border: 0; background: transparent; width: 100%; outline: none; font-size: var(--fs-s); }
.rail-search:focus-within { border-color: var(--ai-a); }
.search-ico svg { width: 14px; height: 14px; }
.thread-list { overflow-y: auto; min-height: 0; display: flex; flex-direction: column; gap: 2px; margin: 0 -4px; padding: 0 4px; }
.thread-item { position: relative; display: grid; grid-template-columns: 14px 1fr auto; column-gap: 8px; align-items: start; padding: 8px 10px 8px 8px; border-radius: var(--r-m); cursor: pointer; border: 0; background: transparent; text-align: left; width: 100%; }
.thread-item:hover { background: var(--surface-2); }
.thread-item.active { background: var(--surface-3); }
.thread-item.active::before { content: ''; position: absolute; left: 0; top: 10px; bottom: 10px; width: 3px; border-radius: 2px; background: var(--ai-a); }
.thread-dot { width: 8px; height: 8px; border-radius: 50%; margin-top: 7px; background: var(--pending); }
.thread-dot.attention { background: var(--warn); }
.thread-dot.clear { background: var(--pass); }
.thread-dot.running { background: var(--ai-grad); animation: pulse 1.4s ease-in-out infinite; }
.thread-main { min-width: 0; display: flex; flex-direction: column; }
.thread-id { font-family: var(--font-id); font-size: var(--fs-s); }
.thread-name { font-size: var(--fs-s); color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.thread-time { font-size: 11px; color: var(--ink-3); margin-top: 2px; }
.thread-side { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
.count-pill { font-size: 11px; font-weight: 600; padding: 1px 7px; border-radius: 999px; background: var(--warn-soft); color: var(--warn); }
.thread-more { opacity: 0; width: 24px; height: 24px; }
.thread-item:hover .thread-more, .thread-item:focus-within .thread-more { opacity: 1; }
.thread-menu { position: absolute; right: 8px; top: 34px; z-index: 5; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-m); box-shadow: var(--shadow-float); padding: 4px; display: flex; flex-direction: column; min-width: 130px; }
.thread-menu button { text-align: left; border: 0; background: transparent; padding: 7px 10px; border-radius: var(--r-s); cursor: pointer; font-size: var(--fs-s); }
.thread-menu button:hover { background: var(--surface-3); }
.rail-collapsed .rail { padding: 12px 8px; align-items: center; }
.rail-collapsed .brand-text, .rail-collapsed .rail-search, .rail-collapsed .btn-label, .rail-collapsed .thread-main, .rail-collapsed .thread-side, .rail-collapsed .thread-time { display: none; }
.rail-collapsed .rail-brand { flex-direction: column; gap: 8px; padding: 0 0 4px; }
.rail-collapsed .rail-collapse { margin: 0; }
.rail-collapsed .rail-new { width: 36px; padding: 0; }
.rail-collapsed .thread-item { grid-template-columns: 1fr; justify-items: center; padding: 8px 0; width: 40px; }
.rail-collapsed .thread-item::before { display: none; }
.rail-collapsed .thread-item.active { background: var(--ai-soft); }
.rail-collapsed .thread-list { width: 100%; align-items: center; }

/* ---------- topbar ---------- */
.topbar { height: 56px; display: flex; align-items: center; gap: 12px; padding: 0 16px; border-bottom: 1px solid var(--line); background: var(--surface); flex: none; }
.rail-open { display: none; }
.app-chip { display: flex; align-items: center; gap: 10px; min-width: 0; }
.app-chip .id { font-weight: 500; }
.app-chip .name { color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.topbar-actions { margin-left: auto; display: flex; align-items: center; gap: 6px; }
.sidebar-open { display: none; }
.menu { position: relative; }
.menu-panel { position: absolute; right: 0; top: 40px; width: 280px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-m); box-shadow: var(--shadow-float); padding: 6px; z-index: 20; }
.menu-item { display: flex; align-items: center; gap: 10px; width: 100%; height: 34px; padding: 0 10px; border: 0; border-radius: var(--r-s); background: transparent; cursor: pointer; text-align: left; font-size: var(--fs-s); }
.menu-item:hover { background: var(--surface-3); }
.menu-sep { height: 1px; background: var(--line); margin: 6px 4px; }
.menu-title { font-size: var(--fs-xs); color: var(--ink-3); padding: 6px 10px 2px; }
.svc-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 4px 10px; font-size: var(--fs-xs); }
.svc-row .svc-name { color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.seg { display: inline-flex; border: 1px solid var(--line-strong); border-radius: 999px; overflow: hidden; flex: none; }
.seg button { border: 0; background: transparent; padding: 2px 8px; font-size: 11px; cursor: pointer; color: var(--ink-2); }
.seg button.on { background: var(--ink); color: var(--bg); }

/* ---------- conversation ---------- */
.conversation { flex: 1; overflow-y: auto; min-height: 0; }
.messages { max-width: var(--content-w); margin: 0 auto; padding: 24px 24px 8px; display: flex; flex-direction: column; gap: 18px; }
.msg { animation: rise var(--dur) var(--ease); }
@keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
.msg-user { align-self: flex-end; max-width: 78%; background: var(--user-bubble); border-radius: 14px 14px 4px 14px; padding: 10px 14px; }
.msg-user .text { white-space: pre-wrap; }
.file-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 6px; }
.file-chip { display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 8px 0 6px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); font-size: var(--fs-xs); max-width: 260px; }
.file-chip .fmt { font-family: var(--font-id); font-size: 10px; font-weight: 500; padding: 1px 5px; border-radius: 4px; background: var(--surface-3); color: var(--ink-2); }
.file-chip .fname { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.file-chip .fsize { color: var(--ink-3); }
.file-chip .rm { border: 0; background: transparent; cursor: pointer; padding: 0; display: inline-flex; color: var(--ink-3); }
.file-chip .rm svg { width: 12px; height: 12px; }
.msg-ai { display: grid; grid-template-columns: 28px 1fr; gap: 12px; align-items: start; }
.avatar { width: 28px; height: 28px; border-radius: 50%; position: relative; background: var(--surface); display: flex; align-items: center; justify-content: center; color: var(--ai-text); }
.avatar::before { content: ''; position: absolute; inset: -2px; border-radius: 50%; background: var(--ai-grad); z-index: -1; }
.avatar::after { content: ''; position: absolute; inset: 0; border-radius: 50%; background: var(--surface); z-index: -1; }
.avatar.working::before { background: conic-gradient(from 0deg, var(--ai-a), var(--ai-b), transparent 60%, var(--ai-a)); animation: spin 2.4s linear infinite; }
.avatar svg { width: 14px; height: 14px; }
@keyframes spin { to { transform: rotate(360deg); } }
.ai-body { min-width: 0; display: flex; flex-direction: column; gap: 10px; }
.ai-body .text p { margin: 0; }
.ai-body .text p + p { margin-top: 6px; }
.typing { display: inline-flex; gap: 4px; align-items: center; height: 22px; }
.typing i { width: 6px; height: 6px; border-radius: 50%; background: var(--ink-3); animation: blink 1.2s infinite; }
.typing i:nth-child(2) { animation-delay: .2s; } .typing i:nth-child(3) { animation-delay: .4s; }
@keyframes blink { 0%, 80%, 100% { opacity: .25; } 40% { opacity: 1; } }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .45; } }

/* ---------- activity block ---------- */
.activity { border: 1px solid var(--line); border-radius: var(--r-m); background: var(--surface-2); padding: 4px; }
.step { border-radius: var(--r-s); }
.step-row { display: flex; align-items: center; gap: 10px; height: 32px; padding: 0 8px; cursor: pointer; border: 0; background: transparent; width: 100%; text-align: left; font-size: var(--fs-s); position: relative; overflow: hidden; }
.step-row .glyph { width: 16px; height: 16px; display: inline-flex; align-items: center; justify-content: center; color: var(--pass); flex: none; }
.step.running .step-row .glyph { color: var(--ai-text); }
.step.running .step-row::after { content: ''; position: absolute; inset: 0; background: linear-gradient(90deg, transparent, color-mix(in srgb, var(--ai-a) 12%, transparent), transparent); background-size: 200% 100%; animation: shimmer 1.6s linear infinite; pointer-events: none; }
@keyframes shimmer { from { background-position: 200% 0; } to { background-position: -200% 0; } }
.step-row .count { margin-left: auto; color: var(--ink-3); font-size: var(--fs-xs); font-variant-numeric: tabular-nums; }
.step-row .chev { color: var(--ink-3); transition: transform var(--dur); }
.step.open .step-row .chev { transform: rotate(90deg); }
.step-items { display: none; padding: 2px 8px 8px 34px; flex-direction: column; gap: 3px; }
.step.open .step-items { display: flex; }
.step-item { display: flex; align-items: center; gap: 8px; font-size: var(--fs-s); color: var(--ink-2); min-height: 22px; }
.step-item .fname { color: var(--ink); }
.step-item .muted { color: var(--ink-3); }
.spinner { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--line-strong); border-top-color: var(--ai-a); animation: spin .8s linear infinite; flex: none; }
.svc-chips { display: flex; flex-wrap: wrap; gap: 6px; padding: 2px 8px 8px 34px; }
.svc { display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 10px 0 8px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); font-size: var(--fs-xs); }
.svc .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--pending); }
.svc.pass .dot { background: var(--pass); } .svc.fail .dot { background: var(--fail); } .svc.unavailable .dot { background: var(--info); } .svc.info .dot { background: var(--info); }
.svc .spinner { width: 10px; height: 10px; border-width: 1.5px; }
.badge { font-family: var(--font-id); font-size: 10px; font-weight: 500; padding: 1px 5px; border-radius: 4px; background: var(--surface-3); color: var(--ink-2); }

/* ---------- pills & status ---------- */
.pill { display: inline-flex; align-items: center; gap: 6px; height: 22px; padding: 0 9px; border-radius: 999px; font-size: var(--fs-xs); font-weight: 500; white-space: nowrap; }
.pill.pass { background: var(--pass-soft); color: var(--pass); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.fail { background: var(--fail-soft); color: var(--fail); }
.pill.info, .pill.unavailable { background: var(--info-soft); color: var(--info); }
.pill.pending { background: var(--pending-soft); color: var(--pending); }
.pill.confirmed { background: var(--ai-soft); color: var(--ai-text); }
.st { display: inline-flex; width: 16px; height: 16px; align-items: center; justify-content: center; flex: none; }
.st.pass { color: var(--pass); } .st.warn { color: var(--warn); } .st.fail { color: var(--fail); } .st.info { color: var(--info); } .st.pending { color: var(--pending); } .st.unavailable { color: var(--info); }

/* ---------- document card ---------- */
.card { border: 1px solid var(--line); border-radius: var(--r-m); background: var(--surface); overflow: hidden; }
.card.expanded { border-left: 3px solid var(--line-strong); }
.card.expanded.pass { border-left-color: var(--pass); } .card.expanded.warn { border-left-color: var(--warn); } .card.expanded.fail { border-left-color: var(--fail); } .card.expanded.unavailable, .card.expanded.info { border-left-color: var(--info); } .card.expanded.pending { border-left-color: var(--ai-a); }
.card-head { display: flex; align-items: center; gap: 10px; min-height: 48px; padding: 6px 12px; cursor: pointer; }
.card-head:hover { background: var(--surface-2); }
.card-head .tico { color: var(--ink-2); display: inline-flex; }
.card-head .tico svg { width: 20px; height: 20px; }
.card-type { position: relative; display: inline-flex; align-items: center; }
.card-type select { appearance: none; -webkit-appearance: none; border: 0; background: transparent; font-weight: 500; padding: 4px 18px 4px 4px; border-radius: var(--r-s); cursor: pointer; }
.card-type select:hover { background: var(--surface-3); }
.card-type svg { position: absolute; right: 4px; pointer-events: none; width: 12px; height: 12px; color: var(--ink-3); }
.card-file { color: var(--ink-3); font-size: var(--fs-s); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.conf { font-size: var(--fs-xs); color: var(--ink-3); white-space: nowrap; }
.conf-meter { display: inline-flex; align-items: center; gap: 6px; font-size: var(--fs-xs); color: var(--ink-2); white-space: nowrap; }
.conf-meter .conf-bar { width: 48px; }
.conf-meter b { font-weight: 500; font-variant-numeric: tabular-nums; }
.fields thead td { font-size: 11px; color: var(--ink-3); padding-top: 0; padding-bottom: 4px; }
.card-head .pill { margin-left: auto; }
.card-head .chev { color: var(--ink-3); transition: transform var(--dur); }
.card.expanded .card-head .chev { transform: rotate(180deg); }

.tabs { display: flex; gap: 4px; padding: 0 12px; border-bottom: 1px solid var(--line); }

/* ---------- composer ---------- */

/* ---------- sidebar ---------- */
.sidebar { background: var(--surface); border-left: 1px solid var(--line); overflow: hidden; min-height: 0; height: 100vh; display: flex; flex-direction: column; }
.sb-section { display: flex; flex-direction: column; min-height: 0; flex: 1 1 50%; border-bottom: 1px solid var(--line); }

.sb-section.collapsed .sb-body { display: none; }
.sb-bar { display: flex; align-items: center; gap: 8px; padding: 12px 14px; border-bottom: 1px solid var(--line); background: var(--surface); cursor: pointer; user-select: none; flex: none; }
.sb-bar h3 { font-size: var(--fs-s); font-weight: 600; flex: 1; }
.sb-bar .muted { font-size: var(--fs-xs); color: var(--ink-3); font-weight: 400; }
.sb-bar .chev { color: var(--ink-3); transition: transform var(--dur); display: inline-flex; }
.sb-section.collapsed .sb-bar .chev { transform: rotate(-90deg); }
.sb-body { overflow-y: auto; min-height: 0; padding: 8px 10px 14px; }

.sb-head .id { font-weight: 500; }
.group-name { font-size: 11px; font-weight: 500; color: var(--ink-3); margin: 8px 6px 2px; }
.app-row { display: grid; grid-template-columns: 108px 1fr; column-gap: 8px; align-items: start; padding: 4px 22px 4px 6px; border-radius: var(--r-s); cursor: pointer; position: relative; }
.app-row:hover { background: var(--surface-2); }

.req-list { display: flex; flex-direction: column; }
.req-row { display: flex; align-items: center; gap: 10px; padding: 7px 6px; border-radius: var(--r-s); font-size: var(--fs-s); cursor: default; border: 0; background: transparent; width: 100%; text-align: left; }
.req-row.link { cursor: pointer; }

.tile .l { font-size: var(--fs-xs); color: var(--ink-3); }
.tile.warn .n { color: var(--warn); } .tile.fail .n { color: var(--fail); } .tile.pass .n { color: var(--pass); }
.shortfall { margin: 10px 0; display: flex; flex-direction: column; gap: 4px; }
.shortfall li { font-size: var(--fs-s); color: var(--ink-2); padding-left: 14px; position: relative; }
.shortfall li::before { content: ''; position: absolute; left: 0; top: 8px; width: 6px; height: 6px; border-radius: 50%; background: var(--warn); }
.sb-summary-btn { width: 100%; margin-top: 10px; }

/* ---------- dialog ---------- */
.scrim { position: fixed; inset: 0; background: var(--scrim); z-index: 40; }
.dialog { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 440px; max-width: calc(100vw - 32px); background: var(--surface); border-radius: var(--r-l); box-shadow: var(--shadow-float); padding: 20px; z-index: 45; display: flex; flex-direction: column; gap: 12px; animation: rise var(--dur) var(--ease); }

.unknown-prompt { display: flex; flex-wrap: wrap; gap: 6px; }

/* ---------- responsive ---------- */
@media (max-width: 1280px) {
  .app { grid-template-columns: 56px 1fr var(--sidebar-w); }

  .rail-new { width: 36px; padding: 0; }
  .thread-item { grid-template-columns: 1fr; justify-items: center; padding: 8px 0; width: 40px; }
  .thread-item::before { display: none; }
  .thread-item.active { background: var(--ai-soft); }
  .thread-list { width: 100%; align-items: center; }
  .app.rail-expanded { grid-template-columns: var(--rail-w) 1fr var(--sidebar-w); }
  .app.rail-expanded .rail { padding: 12px 10px; align-items: stretch; }
  .app.rail-expanded .brand-text, .app.rail-expanded .rail-search, .app.rail-expanded .btn-label, .app.rail-expanded .thread-main, .app.rail-expanded .thread-side, .app.rail-expanded .thread-time, .app.rail-expanded .rail-collapse { display: flex; }
  .app.rail-expanded .rail-brand { flex-direction: row; gap: 10px; padding: 4px 4px 8px; }
  .app.rail-expanded .rail-new { width: 100%; padding: 0 14px; }
  .app.rail-expanded .thread-item { grid-template-columns: 14px 1fr auto; justify-items: stretch; padding: 8px 10px 8px 8px; width: 100%; }
  .app.rail-expanded .thread-item::before { display: block; }
  .app.rail-expanded .thread-item.active { background: var(--surface-3); }
  .app.rail-expanded .thread-list { align-items: stretch; }
}
@media (max-width: 1100px) {
  .app, .app.rail-expanded { grid-template-columns: 56px 1fr; }
  .sidebar { position: fixed; top: 0; right: 0; bottom: 0; width: var(--sidebar-w); z-index: 42; transform: translateX(100%); transition: transform var(--dur) var(--ease); box-shadow: var(--shadow-float); }
  .app.sidebar-open .sidebar { transform: none; }
  .sidebar-open { display: inline-flex; }
}
@media (max-width: 720px) {
  .app, .app.rail-expanded { grid-template-columns: 1fr; }
  .rail { position: fixed; top: 0; left: 0; bottom: 0; width: var(--rail-w); z-index: 42; transform: translateX(-100%); transition: transform var(--dur) var(--ease); box-shadow: var(--shadow-float); padding: 12px 10px; align-items: stretch; }
  .app.rail-expanded .rail { transform: none; }
  .rail .brand-text, .rail .rail-search, .rail .btn-label, .rail .thread-main, .rail .thread-side, .rail .thread-time { display: flex; }
  .rail .rail-brand { flex-direction: row; }
  .rail .rail-new { width: 100%; padding: 0 14px; }
  .rail .thread-item { grid-template-columns: 14px 1fr auto; justify-items: stretch; padding: 8px 10px 8px 8px; width: 100%; }
  .rail-open { display: inline-flex; }
  .messages, .composer-wrap { padding-left: 12px; padding-right: 12px; }
  .msg-user { max-width: 92%; }
  .fields td.lbl { width: 120px; }
}

/* ================= AI-centric polish ================= */
.main { background: transparent; }
.topbar, .conversation, .composer-wrap, .drop-overlay { position: relative; z-index: 1; }
.topbar { background: var(--surface); }
.composer { background: var(--surface); border-color: var(--line-strong); transition: box-shadow var(--dur), border-color var(--dur); }
.composer:focus-within { border-color: var(--ai-a); box-shadow: 0 0 0 3px color-mix(in srgb, var(--ai-a) 10%, transparent), var(--shadow-float); }
.brand-mark { background: none; border-radius: 0; }
.thread-item { transition: background var(--dur); }
.chip { transition: transform .15s var(--ease), border-color .15s, box-shadow .15s, color .15s; }
.chip:hover { transform: translateY(-1px); box-shadow: 0 0 0 3px color-mix(in srgb, var(--ai-a) 12%, transparent); }
.chips .chip { animation: rise .4s var(--ease) both; }
.chips .chip:nth-child(2) { animation-delay: 50ms; } .chips .chip:nth-child(3) { animation-delay: 100ms; } .chips .chip:nth-child(4) { animation-delay: 150ms; } .chips .chip:nth-child(5) { animation-delay: 200ms; }
@keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
.msg { animation: none; }
.msg.fresh { animation: rise .32s var(--ease) both; }
.messages.fade { animation: fadeIn .28s var(--ease); }
@keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } }
.msg-ai { grid-template-columns: 32px 1fr; gap: 14px; }
.msg-ai .avatar { display: none; }
.msg-greeting { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 18px; padding: 40px 0 8px; }
.msg-greeting .text { max-width: 520px; font-size: var(--fs-l); color: var(--ink-2); }
.msg-greeting .text p:first-child { color: var(--ink); font-weight: 500; font-size: var(--fs-xl); text-wrap: balance; }
.typing { gap: 6px; }
.typing i { background: var(--ai-grad); width: 7px; height: 7px; }
.typing .lbl { font-size: var(--fs-s); color: var(--ink-3); margin-left: 4px; }
.activity { background: color-mix(in srgb, var(--surface) 80%, transparent); backdrop-filter: blur(8px); border-color: color-mix(in srgb, var(--ai-a) 16%, var(--line)); }
.fresh .step { animation: rise .3s var(--ease) both; }
.step.done .step-row .glyph { animation: pop .35s var(--ease); color: var(--ai-text); }
@keyframes pop { 0% { transform: scale(.4); opacity: 0; } 70% { transform: scale(1.25); } 100% { transform: scale(1); opacity: 1; } }
.step.running .step-row::after { background: linear-gradient(90deg, transparent, color-mix(in srgb, var(--ai-a) 18%, transparent), color-mix(in srgb, var(--ai-b) 14%, transparent), transparent); }
.fresh .svc { animation: rise .3s var(--ease) both; }
.svc.pass .dot, .svc.fail .dot, .svc.unavailable .dot { animation: pop .3s var(--ease); box-shadow: 0 0 8px currentColor; }
.svc.pass .dot { color: var(--pass); } .svc.fail .dot { color: var(--fail); } .svc.unavailable .dot { color: var(--info); }
.card { position: relative; transition: border-color var(--dur), box-shadow var(--dur), transform var(--dur); }
.card.enter { animation: rise .45s var(--ease) both; }
.card:hover { border-color: color-mix(in srgb, var(--ai-a) 30%, var(--line)); }
.card.pending::after { content: ''; position: absolute; left: 0; right: 0; top: 0; height: 2px; background: var(--ai-grad); animation: scan 1.8s ease-in-out infinite; opacity: .6; pointer-events: none; }
@keyframes scan { 0% { top: 0; opacity: 0; } 15% { opacity: .8; } 85% { opacity: .8; } 100% { top: calc(100% - 2px); opacity: 0; } }
.card-body { animation: expand .22s var(--ease); }
@keyframes expand { from { opacity: 0; transform: translateY(-6px); } }
.fresh .pill, .card.enter .pill { animation: pop .3s var(--ease); }
.pill.pass { box-shadow: 0 0 0 1px color-mix(in srgb, var(--pass) 25%, transparent) inset; }
.val::before, .val::after { transition: border-color .2s, transform .2s; }
.val:hover::before, .val:hover::after { border-color: var(--ai-b); }
.val:hover::before { transform: translate(-1px, -1px); } .val:hover::after { transform: translate(1px, 1px); }
.fields tr.row-flash td { animation: flash 1.2s var(--ease); }
@keyframes flash { 0% { background: color-mix(in srgb, var(--ai-b) 28%, transparent); } 100% { background: transparent; } }
.cite { transition: transform .15s var(--ease), box-shadow .15s; }
.cite:hover { transform: translateY(-1px); box-shadow: 0 0 0 3px color-mix(in srgb, var(--ai-a) 14%, transparent); }
.app-row { transition: background var(--dur); }
.app-row.changed .v { animation: flash 1.4s var(--ease); border-radius: 4px; }
.dialog { border: 1px solid color-mix(in srgb, var(--ai-a) 18%, var(--line)); }
.opt.on { box-shadow: 0 0 0 3px color-mix(in srgb, var(--ai-a) 14%, transparent); }
.menu-panel { backdrop-filter: blur(14px); background: var(--glass); }
.thread-dot.running { box-shadow: 0 0 10px var(--glow-a); }
.icon-btn:hover { color: var(--ai-text); }
.brand-mark { width: 26px; height: 26px; filter: drop-shadow(0 0 8px var(--glow-a)); }
.messages.empty { min-height: 100%; justify-content: center; }
.messages.empty .msg-greeting { padding: 0 0 12vh; }
.conf-bar i { transition: width .6s var(--ease); }
.brand-svg { width: 26px; height: 26px; display: block; }
.brand-mark { filter: none; }
.caret { display: inline-block; width: 2px; height: 1em; background: var(--ai-a); margin-left: 2px; vertical-align: -2px; animation: blinkCaret 1s steps(2) infinite; }
@keyframes blinkCaret { 50% { opacity: 0; } }
.cites.fresh { animation: rise .3s var(--ease) both; }
.msg.fresh .text { animation: none; }
/* preview.css — mock document renders shown in the Preview tab */
.preview { display: flex; justify-content: center; padding: 12px 0 4px; overflow-x: auto; }
.preview .pv-label { font-size: 11px; color: var(--ink-3); line-height: 1.3; }
.preview .pv-value { font-size: 13px; color: var(--ink); line-height: 1.35; overflow-wrap: anywhere; }
.preview .id { font-family: var(--font-id); font-size: 0.93em; letter-spacing: .02em; }

/* Highlight boxes on AI-read values */
.preview .hl { outline: 1.5px solid color-mix(in srgb, var(--ai-a) 65%, transparent); outline-offset: 2px; border-radius: 3px; }
.preview .hl.active { background: color-mix(in srgb, var(--ai-b) 22%, transparent); outline-color: var(--ai-b); }
.preview .hl.ok { outline-color: var(--pass); }

/* Shared bits */

  E.assignType = (doc, typeId, application) => {
    doc.typeId = typeId;
    doc.confidence = (doc.sample && doc.sample.typeId === typeId) ? doc.sample.confidence : 0.75;
    doc.alternatives = [];
    doc.confirmed = false;
    return E.extract(doc, application);
  };

  // ---------- checks ----------
  const mkCheck = (doc, group, key, title, status, detail, fieldKey) => ({ id: `${doc.id}:${key}`, docId: doc.id, group, title, status, detail, fieldKey: fieldKey || null, acknowledged: false, requested: false, manual: false, service: null });

  E.ruleChecks = (doc, thread) => {
    const t = DI.DOC_TYPES[doc.typeId] || DI.DOC_TYPES.unknown, app = thread.application.fields, out = [];
    if (doc.typeId === 'unknown') return out;
    const mk = (key, title, status, detail, fieldKey) => out.push(mkCheck(doc, 'rule', key, title, status, detail, fieldKey));
    for (const f of t.fields) {
      const v = doc.fields[f.key]?.value; if (v == null || v === '') continue;
      if (f.appKey === 'applicantName') { const s = E.nameSimilarity(v, app.applicantName); mk('name', 'Name matches application', s === 1 ? 'pass' : s >= 0.7 ? 'warn' : 'fail', s === 1 ? `${t.label} reads ${v}. Application reads ${app.applicantName}.` : `${t.label} reads ${v}. Application reads ${app.applicantName || 'nothing'}. Similarity ${Math.round(s * 100)}%.`, f.key); }
      else if (f.appKey === 'parentName') { const s = E.nameSimilarity(v, app.parentName); mk('parent', "Father's name matches application", s === 1 ? 'pass' : s >= 0.7 ? 'warn' : 'fail', `${t.label} reads ${v}. Application reads ${app.parentName || 'nothing'}.`, f.key); }
      else if (f.appKey === 'dob') { const ok = v === app.dob; mk('dob', 'Date of birth matches application', ok ? 'pass' : 'fail', ok ? `Both read ${E.fmtDate(v)}.` : `${t.label} reads ${E.fmtDate(v)}. Application reads ${E.fmtDate(app.dob) || 'nothing'}.`, f.key); }
      else if (f.appKey === 'gender') { const ok = norm(v) === norm(app.gender); mk('gender', 'Gender matches application', ok ? 'pass' : 'fail', ok ? `Both read ${v}.` : `${t.label} reads ${v}. Application reads ${app.gender || 'nothing'}.`, f.key); }
      else if (f.appKey === 'aadhaarNo' || f.appKey === 'pan') { const a = String(v).replace(/\s/g, '').toUpperCase(), b = String(app[f.appKey] || '').replace(/\s/g, '').toUpperCase(); const ok = a === b; mk('id', `${f.label} matches application`, ok ? 'pass' : 'fail', ok ? `Both read ${f.mask ? E.maskId(a) : a}.` : `${t.label} reads ${f.mask ? E.maskId(a) : a}. Application reads ${f.mask ? E.maskId(b) : b || 'nothing'}.`, f.key); }
      else if (f.addressCheck) { const o = E.addressOverlap(v, app.address); mk('address', 'Address matches application', o >= 0.5 ? 'pass' : 'warn', o >= 0.5 ? 'Address on the document matches the application.' : `Address on the document differs from the application. Document: ${v}. Application: ${app.address || 'nothing'}. Addresses change often, so this is advisory.`, f.key); }
      else if (f.appKey === 'surveyNo') { const ok = norm(v) === norm(app.surveyNo); mk('survey', 'Survey number matches application', ok ? 'pass' : 'fail', ok ? `Both read ${v}.` : `${t.label} reads ${v}. Application reads ${app.surveyNo || 'nothing'}.`, f.key); }
      else if (f.appKey === 'plotNo') { const ok = norm(v) === norm(app.plotNo); mk('plot', 'Plot number matches application', ok ? 'pass' : 'warn', ok ? `Both read ${v}.` : `${t.label} reads ${v}. Application reads ${app.plotNo || 'nothing'}.`, f.key); }
      else if (f.appKey === 'village') { const ok = norm(v) === norm(app.village); mk('village', 'Village matches application', ok ? 'pass' : 'warn', ok ? `Both read ${v}.` : `${t.label} reads ${v}. Application reads ${app.village || 'nothing'}.`, f.key); }
      else if (f.appKey === 'floors') { const ok = norm(v) === norm(app.floors); mk('floors', 'Floors match proposal', ok ? 'pass' : 'warn', ok ? `Both read ${v}.` : `${t.label} approves ${v}. Proposal is ${app.floors || 'not set'}.`, f.key); }
      else if (f.extentCheck) { const d = E.parseExtent(v), a = Number(app.extentSqYd); const ok = d != null && a && Math.abs(d - a) < 0.5; mk('extent', 'Extent matches application', ok ? 'pass' : 'warn', ok ? `Both read ${a} sq. yd.` : `${t.label} reads ${v}. Application reads ${a || 'nothing'} sq. yd.`, f.key); }
      if (f.validity) { const days = E.daysUntil(v); const lapsed = days < 0; const status = lapsed ? (t.lapseIsInfo ? 'info' : 'fail') : days <= 180 ? 'warn' : 'pass'; mk('validity', lapsed ? (t.lapseIsInfo ? 'Permit has lapsed' : 'Document has expired') : days <= 180 ? 'Expires soon' : 'Valid', status, lapsed ? (t.lapseIsInfo ? `Lapsed on ${E.fmtDate(v)}. Treat this as a fresh application; no commencement was recorded under it.` : `Expired on ${E.fmtDate(v)}.`) : days <= 180 ? `Valid until ${E.fmtDate(v)}, ${days} days from today. Ask for a renewal if sanction is expected after that.` : `Valid until ${E.fmtDate(v)}.`, f.key); }
      if (f.heightAtLeast) { const h = Number(v), p = Number(app.heightM); const ok = h >= p; mk('height', 'Proposed height within clearance', ok ? 'pass' : 'fail', ok ? `Clearance ${h} m. Proposed ${p} m.` : `Clearance ${h} m is below the proposed ${p} m.`, f.key); }
    }
    for (const s of t.structure) { const present = doc.structure[s.key] !== false; mk(`structure:${s.key}`, `${s.label} ${present ? 'present' : 'not detected'}`, present ? 'pass' : 'warn', present ? `${s.label} found where the standard template expects it.` : `${s.label} was not detected where the standard template expects it. Check the original before relying on this copy.`, null); }
    return out;
  };

  E.crossChecks = thread => {
    for (const d of thread.docs) d.checks = d.checks.filter(c => c.group !== 'cross');
    const mk = (doc, key, title, status, detail, fieldKey) => doc.checks.push(mkCheck(doc, 'cross', key, title, status, detail, fieldKey));
    const deed = thread.docs.find(d => d.typeId === 'sale_deed' && d.stage !== 'queued'), link = thread.docs.find(d => d.typeId === 'link_doc' && d.stage !== 'queued');
    if (deed && link) {
      const s = E.nameSimilarity(val(deed, 'vendor'), val(link, 'purchaser'));
      mk(deed, 'chain', 'Chain of title links to the link document', s === 1 ? 'pass' : s >= 0.7 ? 'warn' : 'fail', `Sale deed vendor ${val(deed, 'vendor')} ${s === 1 ? 'is' : 'does not clearly match'} the purchaser in link document ${val(link, 'docNo')} (${val(link, 'purchaser')}).`, 'vendor');
      const a = E.parseExtent(val(deed, 'extent')), b = E.parseExtent(val(link, 'extent'));
      mk(deed, 'extent-cross', 'Extent consistent with link document', a != null && a === b ? 'pass' : 'warn', a === b ? `Both deeds read ${a} sq. yd.` : `Sale deed reads ${val(deed, 'extent')}; link document reads ${val(link, 'extent')}.`, 'extent');
      const sv = norm(val(deed, 'surveyNo')) === norm(val(link, 'surveyNo'));
      mk(deed, 'survey-cross', 'Survey number consistent with link document', sv ? 'pass' : 'fail', sv ? `Both deeds read ${val(deed, 'surveyNo')}.` : `Sale deed reads ${val(deed, 'surveyNo')}; link document reads ${val(link, 'surveyNo')}.`, 'surveyNo');
    }
  };

  E.serviceRequest = doc => {
    const t = DI.DOC_TYPES[doc.typeId]; const idField = t.fields.find(f => f.kind === 'id');
    const req = { endpoint: DI.SERVICES[t.service].endpoint };
    if (idField) req[idField.key] = idField.mask ? E.maskId(val(doc, idField.key)) : val(doc, idField.key);
    const name = val(doc, 'name') || val(doc, 'applicant') || val(doc, 'purchaser') || val(doc, 'owner');
    if (name) req.name = name;
    return req;
  };
  E.serviceResult = (doc, thread) => {
    const t = DI.DOC_TYPES[doc.typeId] || DI.DOC_TYPES.unknown, svc = t.service ? DI.SERVICES[t.service] : null;
    const base = { id: `${doc.id}:service`, docId: doc.id, group: 'external', fieldKey: null, acknowledged: false, requested: false, manual: false };
    if (!svc) return { ...base, title: 'No machine interface for this issuer', status: 'info', detail: 'This department does not expose a verification interface. Verify against the original and mark it manually.', service: null };
    const override = thread.serviceOverrides[svc.id] || 'auto';
    const outcome = override === 'auto' ? (doc.sample?.service?.outcome || 'pass') : override;
    const service = { id: svc.id, name: svc.name, latencyMs: svc.latencyMs, request: E.serviceRequest(doc), response: null };
    if (outcome === 'timeout') return { ...base, title: `${svc.name} did not respond`, status: 'unavailable', detail: `No response after ${Math.round(svc.latencyMs * 2.5)} ms. Retry, or verify against the original and mark it manually.`, service: { ...service, response: { error: 'ETIMEDOUT' } } };
    if (outcome === 'fail') return { ...base, title: `${svc.name} did not match`, status: 'fail', detail: "The issuer's record does not match the details read from this document.", service: { ...service, response: { status: 'N', reason: 'DEMOGRAPHIC_MISMATCH' } } };
    return { ...base, title: `${svc.name} confirmed`, status: 'pass', detail: "The issuer's record matches the details read from this document.", service: { ...service, response: doc.sample?.service?.response || { status: 'VALID' } } };
  };

  // ---------- required documents, summary, status ----------
  E.requiredDocs = application => {
    const f = application.fields; const h = Number(f.heightM) || 0;
    const rows = [
      ['aadhaar', true, 'Identity of the applicant'], ['pan', true, 'Identity of the applicant'],
      ['sale_deed', true, 'Title to the plot'], ['link_doc', true, 'Chain of title'],
      ['fire_noc', h > 15, h > 15 ? 'Building height above 15 m' : 'Only for buildings above 15 m'],
      ['aai_noc', h > 15, h > 15 ? 'Building height above 15 m' : 'Only for buildings above 15 m'],
      ['irrigation_noc', f.nearWaterBody === 'Yes', f.nearWaterBody === 'Yes' ? 'Plot is near a water body' : 'Only for plots near a water body'],
      ['building_permit', false, 'If an earlier permission exists'], ['dl', false, 'Additional identity'], ['ec', false, 'Optional'], ['tax_receipt', false, 'Optional']
    ];
    return rows.map(([typeId, required, reason]) => ({ typeId, required, reason }));
  };

  const isOpen = c => (c.status === 'fail' || c.status === 'warn' || c.status === 'unavailable') && !c.acknowledged && !c.manual;

  E.summary = thread => {
    const req = E.requiredDocs(thread.application);
    const done = doneDocs(thread);
    const has = typeId => done.some(d => d.typeId === typeId);
    const required = req.filter(r => r.required);
    const missing = required.filter(r => !has(r.typeId)).map(r => r.typeId);
    const s = { provided: required.length - missing.length, required: required.length, missing, pass: 0, warn: 0, fail: 0, info: 0, unavailable: 0, open: [], confirmedDocs: done.filter(d => d.confirmed).length };
    for (const d of done) for (const c of d.checks) {
      if (c.status === 'pass') s.pass++; else if (c.status === 'warn') s.warn++; else if (c.status === 'fail') s.fail++; else if (c.status === 'info') s.info++; else if (c.status === 'unavailable') s.unavailable++;
      if (isOpen(c)) s.open.push({ docId: d.id, checkId: c.id, text: `${typeLabel(d)}: ${c.title}` });
    }
    return s;
  };
  E.docOpenCount = doc => doc.checks.filter(isOpen).length;
  E.docStatus = doc => {
    if (doc.stage !== 'done') return 'checking';
    const open = doc.checks.filter(isOpen);
    if (open.some(c => c.status === 'fail')) return 'failed';
    if (open.some(c => c.status === 'unavailable')) return 'unavailable';
    if (open.length) return 'attention';
    return 'verified';
  };

  E.threadStatus = thread => {
    if (!thread.docs.length) return 'new';
    if (thread.docs.some(d => d.stage !== 'done')) return 'running';
    const s = E.summary(thread);
    return (s.open.length || s.missing.length) ? 'attention' : 'clear';
  };

  E.rerunChecks = thread => {
    const before = new Map();
    for (const d of thread.docs) for (const c of d.checks) before.set(c.id, c);
    for (const d of doneDocs(thread)) {
      const keep = d.checks.filter(c => c.group === 'external');
      d.checks = [...E.ruleChecks(d, thread), ...keep];
    }
    E.crossChecks(thread);
    const changes = [];
    for (const d of doneDocs(thread)) for (const c of d.checks) {
      const old = before.get(c.id);
      if (old) { c.acknowledged = old.acknowledged; c.requested = old.requested; c.manual = old.manual; if (old.manual && c.group === 'external') { c.status = old.status; c.title = old.title; } }
      if (old && old.status !== c.status) changes.push({ docId: d.id, checkId: c.id, title: c.title, from: old.status, to: c.status });
    }
    return changes;
  };

  const ensureInThread = (thread, docs) => { for (const d of docs) if (!thread.docs.includes(d)) thread.docs.push(d); };

  E.analyzeSync = (thread, docs) => {
    ensureInThread(thread, docs);
    for (const d of docs) { E.identify(d); E.extract(d, thread.application); d.checks = E.ruleChecks(d, thread); d.stage = 'checking'; }
    E.crossChecks(thread);
    for (const d of docs) { if (d.typeId !== 'unknown') d.checks.push(E.serviceResult(d, thread)); d.stage = 'done'; }
    thread.status = E.threadStatus(thread);
  };

  E.analyze = (thread, docs, hooks = {}) => new Promise(resolve => {
    const speed = hooks.speed == null ? 1 : hooks.speed;
    const onStep = hooks.onStep || (() => {}), onDoc = hooks.onDoc || (() => {}), onDone = hooks.onDone || (() => {});
    const wait = (ms, fn) => setTimeout(fn, Math.round(ms * speed));
    ensureInThread(thread, docs);
    thread.status = 'running';
    let identified = 0, extracted = 0;
    onStep('identify', 'running');
    docs.forEach((d, i) => {
      wait(600 + 220 * i, () => {
        E.identify(d); onDoc(d); onStep('identify', 'done', { doc: d });
        if (++identified === docs.length) onStep('identify', 'done');
        wait(900, () => {
          E.extract(d, thread.application); onDoc(d);
          if (extracted === 0) onStep('extract', 'running');
          onStep('extract', 'done', { doc: d });
          if (++extracted === docs.length) {
            onStep('extract', 'done');
            wait(350, () => {
              onStep('checks', 'running');
              for (const x of docs) { x.checks = E.ruleChecks(x, thread); x.stage = 'checking'; onDoc(x); }
              E.crossChecks(thread);
              onStep('checks', 'done', { count: docs.reduce((n, x) => n + x.checks.length, 0) });
              const verifiable = docs.filter(x => x.typeId !== 'unknown');
              for (const x of docs.filter(x => x.typeId === 'unknown')) { x.stage = 'done'; onDoc(x); }
              if (!verifiable.length) { thread.status = E.threadStatus(thread); onStep('verify', 'done'); onDone(); resolve(); return; }
              onStep('verify', 'running');
              let verified = 0;
              verifiable.forEach((x, j) => {
                x.stage = 'verifying'; onDoc(x); onStep('verify', 'running', { doc: x });
                const svc = DI.DOC_TYPES[x.typeId].service ? DI.SERVICES[DI.DOC_TYPES[x.typeId].service] : null;
                const latency = svc ? svc.latencyMs * (0.9 + 0.2 * j) : 300;
                const override = svc ? (thread.serviceOverrides[svc.id] || 'auto') : 'auto';
                const eff = override === 'timeout' ? latency * 2.5 : latency;
                wait(eff, () => {
                  const check = E.serviceResult(x, thread);
                  x.checks = x.checks.filter(c => c.group !== 'external');
                  x.checks.push(check);
                  x.stage = 'done'; onDoc(x); onStep('verify', 'done', { doc: x, check });
                  if (++verified === verifiable.length) { thread.status = E.threadStatus(thread); onStep('verify', 'done'); onDone(); resolve(); }
                });
              });
            });
          }
        });
      });
    });
  });

  // ---------- Q&A ----------
  const listOrNone = (arr, none) => arr.length ? arr : [none];
  const fieldAcross = (thread, keys, label) => {
    const out = [], cites = [];
    for (const d of doneDocs(thread)) for (const k of keys) if (d.fields[k] && d.fields[k].value !== '' && d.fields[k].value != null) {
      const v = d.fields[k].value; const f = DI.DOC_TYPES[d.typeId].fields.find(x => x.key === k);
      out.push(`${typeLabel(d)} reads ${f && f.kind === 'date' ? E.fmtDate(v) : (f && f.mask ? E.maskId(v) : v)}.`); cites.push(cite(d, k));
    }
    return { out, cites, label };
  };

  const INTENTS = [
    { re: /deed.*(name|owner|purchaser)|who (owns|is the purchaser|bought|is the owner)/, fn: thread => {
      const deed = findDoc(thread, 'sale_deed'); const app = thread.application.fields.applicantName;
      if (!deed) return { text: 'No sale deed has been read in this thread yet, so I cannot say whose name it is in.', citations: [] };
      const p = val(deed, 'purchaser'); const s = E.nameSimilarity(p, app);
      const text = s === 1 ? `Yes. The sale deed names ${p} as purchaser, which matches the applicant ${app}. It was registered on ${E.fmtDate(val(deed, 'regDate'))} at ${val(deed, 'sro')} as document ${val(deed, 'docNo')}.`
        : s >= 0.7 ? `Nearly. The purchaser reads ${p} and the application reads ${app}. They are ${Math.round(s * 100)}% similar, so I flagged it for you to confirm.`
        : `No. The purchaser on the sale deed is ${p}, but the application is in the name of ${app}.`;
      return { text, citations: [cite(deed, 'purchaser'), cite(deed, 'docNo')] };
    } },
    { re: /(issue|problem|attention|flag|mismatch|wrong|concern)/, fn: thread => {
      const s = E.summary(thread); const cites = []; const lines = [];
      for (const o of s.open) { const d = thread.docs.find(x => x.id === o.docId); const c = d.checks.find(x => x.id === o.checkId); lines.push(`${typeLabel(d)}: ${c.title}. ${c.detail}`); if (c.fieldKey) cites.push(cite(d, c.fieldKey)); }
      for (const m of s.missing) lines.push(`${DI.DOC_TYPES[m].label} is required and was not provided.`);
      if (!lines.length) return { text: 'Nothing needs attention. Every check passed and all required documents are here.', citations: [] };
      return { text: `${lines.length === 1 ? 'One item needs' : lines.length + ' items need'} your attention.\n` + lines.map(l => `• ${l}`).join('\n'), citations: cites };
    } },
    { re: /(expire|expiry|valid)/, fn: (thread, q) => {
      const mentions = [['aai', 'aai_noc'], ['airport', 'aai_noc'], ['fire', 'fire_noc'], ['irrigation', 'irrigation_noc'], ['licence', 'dl'], ['license', 'dl'], ['permit', 'building_permit'], ['permission', 'building_permit']].filter(([k]) => q.includes(k)).map(([, t]) => t);
      const out = [], cites = [];
      for (const d of doneDocs(thread)) { if (mentions.length && !mentions.includes(d.typeId)) continue; for (const c of d.checks) if (c.id.endsWith(':validity')) { out.push(`${typeLabel(d)}: ${c.detail}`); cites.push(cite(d, c.fieldKey)); } }
      if (!out.length) return { text: mentions.length ? `I have not read a ${mentions.map(t => DI.DOC_TYPES[t].label).join(' or ')} in this thread yet.` : 'None of the documents read so far carries a validity date.', citations: [] };
      return { text: out.length === 1 ? out[0] : out.map(l => `• ${l}`).join('\n'), citations: cites };
    } },
    { re: /(missing|required|need|checklist)/, fn: thread => {
      const req = E.requiredDocs(thread.application); const done = doneDocs(thread);
      const lines = req.filter(r => r.required).map(r => `${DI.DOC_TYPES[r.typeId].label}: ${done.some(d => d.typeId === r.typeId) ? 'provided' : 'missing'} (${r.reason.toLowerCase()})`);
      const missing = req.filter(r => r.required && !done.some(d => d.typeId === r.typeId));
      const head = missing.length ? `${missing.length === 1 ? 'One required document is' : missing.length + ' required documents are'} missing: ${missing.map(m => DI.DOC_TYPES[m.typeId].label).join(', ')}.` : 'All required documents are provided.';
      return { text: head + '\n' + lines.map(l => `• ${l}`).join('\n'), citations: [] };
    } },
    { re: /(chain|link doc|link document|title|vendor)/, fn: thread => {
      const deed = findDoc(thread, 'sale_deed'), link = findDoc(thread, 'link_doc');
      if (!deed || !link) return { text: `I need both the sale deed and the link document to trace the chain of title. ${deed ? 'The link document' : link ? 'The sale deed' : 'Both'} ${deed || link ? 'is' : 'are'} not here yet.`, citations: [] };
      const c = deed.checks.find(x => x.id.endsWith(':chain'));
      return { text: `${c && c.status === 'pass' ? 'The chain of title holds.' : 'The chain of title needs a look.'} ${c ? c.detail : ''} The link document ${val(link, 'docNo')} was registered on ${E.fmtDate(val(link, 'regDate'))}, from ${val(link, 'vendor')} to ${val(link, 'purchaser')}.`, citations: [cite(deed, 'vendor'), cite(link, 'purchaser')] };
    } },
    { re: /(extent|area|sq\b|sq\.|square)/, fn: thread => {
      const app = thread.application.fields.extentSqYd; const { out, cites } = fieldAcross(thread, ['extent'], 'extent');
      if (!out.length) return { text: `The application states ${app} sq. yd. No document with an extent has been read yet.`, citations: [] };
      const allMatch = doneDocs(thread).filter(d => d.fields.extent).every(d => E.parseExtent(val(d, 'extent')) === Number(app));
      return { text: `${allMatch ? 'Yes, the extents agree.' : 'Not everywhere.'} The application states ${app} sq. yd. ` + out.join(' '), citations: cites };
    } },
    { re: /(summary|summarise|summarize|overview|status|where are we)/, fn: thread => {
      const s = E.summary(thread); const docs = doneDocs(thread);
      if (!docs.length) return { text: `Nothing has been analyzed yet for ${thread.application.id}. Attach the applicant's documents to start.`, citations: [] };
      return { text: `${docs.length} document${docs.length === 1 ? '' : 's'} read for ${thread.application.id}. ${s.provided} of ${s.required} required documents provided. ${s.pass} checks passed, ${s.warn} warnings, ${s.fail} failed${s.unavailable ? `, ${s.unavailable} unavailable` : ''}.` + (s.open.length || s.missing.length ? `\nOpen items:\n` + [...s.open.map(o => `• ${o.text}`), ...s.missing.map(m => `• ${DI.DOC_TYPES[m].label} not provided`)].join('\n') : '\nNothing is open.'), citations: [] };
    } },
    { re: /(uidai|verif|external|service|igrs|sarathi|nocas|registry)/, fn: thread => {
      const lines = [], cites = [];
      for (const d of doneDocs(thread)) { const c = d.checks.find(x => x.group === 'external'); if (c) { lines.push(`${typeLabel(d)}: ${c.title}${c.service ? ` (${(c.service.latencyMs / 1000).toFixed(1)} s)` : ''}. ${c.manual ? 'Marked as verified manually.' : c.status === 'pass' ? '' : c.detail}`); } }
      if (!lines.length) return { text: 'No external verification has run yet.', citations: [] };
      return { text: lines.map(l => `• ${l.trim()}`).join('\n'), citations: cites };
    } },

    D.appendChild(U.el(`<div class="summary-tiles"><div class="tile pass"><div class="n">${sum.pass}</div><div class="l">passed</div></div><div class="tile warn"><div class="n">${sum.warn}</div><div class="l">warnings</div></div><div class="tile fail"><div class="n">${sum.fail}</div><div class="l">failed</div></div><div class="tile"><div class="n">${sum.unavailable + sum.info}</div><div class="l">to note</div></div></div>`));
    if (thread.shortfall.length) { const ul = U.el('<ul class="shortfall"></ul>'); ul.appendChild(U.el('<div class="group-name">Requested from applicant</div>')); for (const s of thread.shortfall) ul.appendChild(U.el(`<li>${U.esc(s)}</li>`)); D.appendChild(ul); }
    const btn = U.el(`<button type="button" class="btn btn-primary sb-summary-btn" ${thread.docs.length ? '' : 'disabled title="Load documents first"'}>Write scrutiny note</button>`);
    btn.onclick = () => { U.writeNote(thread); $('app').classList.remove('sidebar-open'); };
    D.appendChild(btn);
  };
  U.onApplicationEdit = (thread, fd, oldValue, newValue) => {
    const app = thread.application; const wasBlank = !app.fields.applicantName;
    const before = E().requiredDocs(app).filter(r => r.required).map(r => r.typeId);
    app.fields[fd.key] = newValue;
    if (app.status === 'Not started' && app.fields.applicantName) app.status = 'Under scrutiny';
    if (fd.key === 'applicantName' && (thread.title === 'New scrutiny' || !thread.title)) thread.title = app.id;
    const after = E().requiredDocs(app).filter(r => r.required).map(r => r.typeId);
    const added = after.filter(x => !before.includes(x)).map(x => DI.DOC_TYPES[x].label), removed = before.filter(x => !after.includes(x)).map(x => DI.DOC_TYPES[x].label);
    const show = v => v === '' || v == null ? 'blank' : fd.kind === 'date' ? E().fmtDate(v) : fd.mask ? E().maskId(v) : String(v);
    if (thread.docs.some(d => d.stage === 'done')) {
      const changes = E().rerunChecks(thread);
      U.refreshAfterChange(thread, changes, `${fd.label} changed from ${show(oldValue)} to ${show(newValue)}`);
    } else { U.renderSidebar(thread); U.renderTopbar(); U.renderRail(); U.renderChips(thread); }
    if (added.length || removed.length) {
      const bits = []; if (added.length) bits.push(`${added.join(' and ')} ${added.length > 1 ? 'are' : 'is'} now required`); if (removed.length) bits.push(`${removed.join(' and ')} ${removed.length > 1 ? 'are' : 'is'} no longer required`);
      U.addMessage(thread, { role: 'ai', kind: 'update', text: `The proposal changed, so the required documents changed: ${bits.join('; ')}.` });
      U.refreshAttention(thread); U.renderSidebar(thread);
    }
    if (wasBlank && app.fields.applicantName) U.renderMessages(thread);
    const row = [...document.querySelectorAll('#sbApplication .app-row')].find(r => r.querySelector('.lbl')?.textContent === fd.label); if (row) row.classList.add('changed');
  };

  /* ---------- dialog & demo menu ---------- */
  U.openNewDialog = () => {
    const root = $('dialogRoot'); root.innerHTML = '';
    const scrim = U.el('<div class="scrim"></div>');
    const dlg = U.el(`<div class="dialog" role="dialog" aria-label="New scrutiny"><h3>New scrutiny</h3><div class="sub">Pick an application from the queue, or start blank and fill in the details yourself.</div><div class="opts"></div><div class="dialog-actions"><button type="button" class="btn btn-ghost" id="dlgCancel">Cancel</button><button type="button" class="btn btn-primary" id="dlgStart">Start scrutiny</button></div></div>`);
    const opts = dlg.querySelector('.opts'); let choice = DI.APPLICATIONS[0].id;
    const rows = DI.APPLICATIONS.map(a => ({ id: a.id, t: `${a.id}`, d: `${a.fields.applicantName}, ${a.fields.proposedUse.toLowerCase()}, ${a.fields.floors}, ${a.fields.heightM} m, ${a.fields.village}` })).concat([{ id: 'blank', t: 'Blank application', d: 'Fill in the applicant, plot, and proposal in the sidebar.' }]);
    const paint = () => { opts.innerHTML = ''; for (const r of rows) { const o = U.el(`<div class="opt${choice === r.id ? ' on' : ''}" tabindex="0"><span class="radio"></span><span><div class="t ${r.id !== 'blank' ? 'id' : ''}">${U.esc(r.t)}</div><div class="d">${U.esc(r.d)}</div></span></div>`); o.onclick = () => { choice = r.id; paint(); }; o.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { choice = r.id; paint(); } }; opts.appendChild(o); } };
    paint();
    const close = () => root.innerHTML = '';
    dlg.querySelector('#dlgCancel').onclick = close; scrim.onclick = close;
    dlg.querySelector('#dlgStart').onclick = () => {
      let application, title;
      if (choice === 'blank') { application = DI.BLANK_APPLICATION(); application.id = `BN/2026/NEW-${++U.state.newCount}`; title = 'New scrutiny'; }
      else { application = structuredClone(DI.APPLICATIONS.find(a => a.id === choice)); title = application.id; }
      const t = U.createThread({ application, title }); U.addMessage(t, U.greeting(t)); close(); U.switchThread(t.id);
    };
    root.appendChild(scrim); root.appendChild(dlg); dlg.querySelector('#dlgStart').focus();
    document.addEventListener('keydown', function esc(e) { if (e.key === 'Escape') { close(); document.removeEventListener('keydown', esc); } });
  };
  const renderDemoPanel = () => {
    const p = $('demoPanel'); const t = U.activeThread(); p.innerHTML = '';
    const item = (text, fn, icon) => { const b = U.el(`<button type="button" class="menu-item">${icon ? U.icon(icon) : ''}<span>${text}</span></button>`); b.onclick = () => { closeDemo(); fn(); }; p.appendChild(b); };
    item('Load sample set', () => U.loadSampleSet(t), 'sparkle');
    item('Reset this thread', () => U.resetThread(t), 'refresh');
    item('Reset all threads', () => U.resetAll(), 'trash');
    p.appendChild(U.el('<div class="menu-sep"></div>'));
    p.appendChild(U.el('<div class="menu-title">External services for the next run in this thread</div>'));
    for (const s of Object.values(DI.SERVICES)) {
      const cur = t.serviceOverrides[s.id] || 'auto';
      const row = U.el(`<div class="svc-row"><span class="svc-name" title="${U.esc(s.name)}">${U.esc(s.name.replace(' verification', '').replace(' check', '').replace(' lookup', ''))}</span><span class="seg"></span></div>`);
      const seg = row.querySelector('.seg');
      for (const [v, l] of [['auto', 'Auto'], ['fail', 'Fail'], ['timeout', 'Timeout']]) { const b = U.el(`<button type="button" class="${cur === v ? 'on' : ''}">${l}</button>`); b.onclick = e => { e.stopPropagation(); t.serviceOverrides[s.id] = v; renderDemoPanel(); }; seg.appendChild(b); }
      p.appendChild(row);
    }
  };
  const closeDemo = () => { $('demoPanel').hidden = true; $('demoBtn').setAttribute('aria-expanded', 'false'); };
  U.resetThread = t => { t.docs = []; t.messages = []; t.shortfall = []; t.status = 'new'; t.seq = 0; U.addMessage(t, U.greeting(t)); if (t.id === U.state.activeId) U.switchThread(t.id); };
  U.resetAll = () => { U.state.threads = []; U.seed(); U.switchThread([...U.state.threads].sort((a, b) => b.updatedAt - a.updatedAt)[0].id); U.toast('Threads reset'); };
  U.toast = text => { document.querySelectorAll('.toast').forEach(x => x.remove()); const el = U.el(`<div class="toast">${U.esc(text)}</div>`); document.body.appendChild(el); setTimeout(() => el.remove(), 2200); };
  U.setTheme = name => { document.documentElement.dataset.theme = name; U.state.theme = name; try { localStorage.setItem('di-theme', name); } catch {} $('themeBtn').innerHTML = U.icon(name === 'dark' ? 'sun' : 'moon'); };

  /* ---------- greeting & seeding ---------- */
  U.greeting = thread => {
    const f = thread.application.fields; const blank = !f.applicantName;
    return { role: 'ai', kind: 'greeting', text: blank ? 'This is a new scrutiny. Fill in the application details on the right, then attach the applicant\'s documents.' : `I'm ready to scrutinize ${thread.application.id} for ${f.applicantName}.\nAttach the applicant's documents, or load the sample set to see how this works.` };
  };
  const seedAnalyzed = (app, agoMs, question) => {
    const t = U.createThread({ application: structuredClone(app), title: app.id });
    t.messages.push(Object.assign(U.greeting(t), { id: `m_${t.id}_${++t.seq}` }));
    const samples = DI.SAMPLE_SETS[app.id];
    t.messages.push({ id: `m_${t.id}_${++t.seq}`, role: 'user', kind: 'user', text: 'Verify these for the application', files: samples.map(s => s.file) });
    const docs = samples.map(s => E().docFromSample(t, s));
    E().analyzeSync(t, docs);
    const sum = E().summary(t);
    const steps = [
      { id: 'identify', state: 'done', open: false, items: docs.map(d => ({ text: d.file.name, sub: label(d), badge: d.file.format, pct: `${Math.round(d.confidence * 100)}%` })) },
      { id: 'extract', state: 'done', open: false, items: docs.map(d => ({ text: d.file.name, sub: `${Object.keys(d.fields).length} fields` })) },
      { id: 'checks', state: 'done', open: false, items: [], count: docs.reduce((a, d) => a + d.checks.length, 0) },
      { id: 'verify', state: 'done', open: false, items: docs.map(d => { const c = d.checks.find(x => x.group === 'external'); return { docId: d.id, text: typeOf(d).service ? DI.SERVICES[typeOf(d).service].name.split(' ')[0] : label(d), status: c ? c.status : 'pass' }; }) },
    ];
    t.messages.push({ id: `m_${t.id}_${++t.seq}`, role: 'ai', kind: 'analysis', activity: { steps }, docIds: docs.map(d => d.id), text: summaryLine(t, docs), attention: sum.open, missing: sum.missing });
    if (question) { t.messages.push({ id: `m_${t.id}_${++t.seq}`, role: 'user', kind: 'user', text: question }); const a = E().answer(t, question); t.messages.push({ id: `m_${t.id}_${++t.seq}`, role: 'ai', kind: 'answer', text: a.text, citations: a.citations }); }
    t.status = E().threadStatus(t); t.updatedAt = Date.now() - agoMs;
    return t;
  };
  U.seed = () => {
    seedAnalyzed(DI.APPLICATIONS[1], 3 * 3600e3, null);
    seedAnalyzed(DI.APPLICATIONS[0], 40 * 60e3, "Is the sale deed in the applicant's name?");
    const fresh = U.createThread({ application: structuredClone(DI.APPLICATIONS[2]), title: DI.APPLICATIONS[2].id });
    fresh.messages.push(Object.assign(U.greeting(fresh), { id: `m_${fresh.id}_${++fresh.seq}` }));
    fresh.updatedAt = Date.now();
  };

  /* ---------- boot ---------- */
  U.wire = () => {
    $('themeBtn').onclick = () => U.setTheme(U.state.theme === 'dark' ? 'light' : 'dark');
    $('railToggle').onclick = () => $('app').classList.toggle('rail-collapsed');
    $('railOpen').onclick = () => $('app').classList.toggle('rail-expanded');
    $('sidebarToggle').onclick = () => $('app').classList.toggle('sidebar-open');
    $('scrim').onclick = () => $('app').classList.remove('sidebar-open');
    $('newThreadBtn').onclick = U.openNewDialog;
    $('threadSearch').oninput = U.renderRail;
    $('demoBtn').onclick = e => { e.stopPropagation(); const p = $('demoPanel'); if (p.hidden) { renderDemoPanel(); p.hidden = false; $('demoBtn').setAttribute('aria-expanded', 'true'); } else closeDemo(); };
    document.addEventListener('click', e => { if (!e.target.closest('#demoMenu')) closeDemo(); });
    document.addEventListener('keydown', e => { if (e.key === 'Escape') { closeDemo(); $('app').classList.remove('sidebar-open'); } });
    const ta = $('composerInput');
    const grow = () => { ta.style.height = 'auto'; ta.style.height = Math.min(160, ta.scrollHeight) + 'px'; };
    ta.oninput = grow;
    ta.onkeydown = e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); $('composer').requestSubmit(); } };
    $('composer').onsubmit = e => { e.preventDefault(); const t = U.activeThread(); U.send(t, ta.value, U.state.pending.slice()); ta.value = ''; grow(); };
    $('attachBtn').onclick = () => $('fileInput').click();
    $('fileInput').onchange = e => { U.stageFiles(Array.from(e.target.files)); e.target.value = ''; };
    const main = $('main'); let dragDepth = 0;
    main.addEventListener('dragenter', e => { e.preventDefault(); dragDepth++; $('dropOverlay').hidden = false; });
    main.addEventListener('dragover', e => e.preventDefault());
    main.addEventListener('dragleave', () => { dragDepth = Math.max(0, dragDepth - 1); if (!dragDepth) $('dropOverlay').hidden = true; });
    main.addEventListener('drop', e => { e.preventDefault(); dragDepth = 0; $('dropOverlay').hidden = true; const files = Array.from(e.dataTransfer.files || []); if (!files.length) return; U.stageFiles(files); if (!ta.value.trim()) { const t = U.activeThread(); U.send(t, 'Verify these for the application', U.state.pending.slice()); } });
    $('attachBtn').innerHTML = U.icon('paperclip'); $('sendBtn').innerHTML = U.icon('send'); $('railToggle').innerHTML = U.icon('panelLeft'); $('railOpen').innerHTML = U.icon('panelLeft'); $('sidebarToggle').innerHTML = U.icon('panelRight');
    document.querySelector('.rail-new .btn-ico').innerHTML = U.icon('plus'); document.querySelector('.brand-mark').innerHTML = ORB({ size: 24, animate: false }); const fav = document.createElement('link'); fav.rel = 'icon'; fav.href = 'data:image/svg+xml,' + encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32"><defs><linearGradient id="g1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4b3fd2"/><stop offset=".55" stop-color="#8f7cff"/><stop offset="1" stop-color="#3d6bff"/></linearGradient><radialGradient id="g2" cx=".3" cy=".25" r=".8"><stop offset="0" stop-color="#fff" stop-opacity=".85"/><stop offset=".55" stop-color="#fff" stop-opacity="0"/></radialGradient></defs><circle cx="16" cy="16" r="15" fill="url(#g1)"/><circle cx="16" cy="16" r="15" fill="url(#g2)"/><path d="M11 8.5h7l4 4v11a1.5 1.5 0 0 1-1.5 1.5h-9.5A1.5 1.5 0 0 1 9.5 23.5v-13.5A1.5 1.5 0 0 1 11 8.5Z" fill="rgba(255,255,255,.2)" stroke="#fff" stroke-width="1.4" stroke-linejoin="round"/><path d="M18 8.5v4h4" fill="none" stroke="#fff" stroke-width="1.4" stroke-linejoin="round"/><path d="M8.5 16.5h15" stroke="#fff" stroke-width="1.8" stroke-linecap="round"/><path d="M12.5 20h7M12.5 22.6h4.5" stroke="#fff" stroke-width="1.2" stroke-linecap="round" opacity=".65"/><path d="M25.5 4.5l.9 2.1 2.1.9-2.1.9-.9 2.1-.9-2.1-2.1-.9 2.1-.9Z" fill="#fff"/></svg>`); document.head.appendChild(fav); document.querySelector('.search-ico').innerHTML = U.icon('search');
  };
  U.boot = () => {
    let theme = 'light'; try { theme = localStorage.getItem('di-theme') || 'light'; } catch {}
    U.wire(); U.setTheme(theme); U.seed();
    const wanted = decodeURIComponent((location.hash || '').slice(1)); const deep = wanted && U.state.threads.find(t => t.application.id === wanted);
    U.switchThread(deep ? deep.id : [...U.state.threads].sort((a, b) => b.updatedAt - a.updatedAt)[0].id);
    setInterval(() => { if (!document.querySelector('.thread-menu')) U.renderRail(); }, 60000);
  };
  document.addEventListener('DOMContentLoaded', U.boot);
  return U;
})();
</script>
</body>
</html>
